name: Build Raspberry Pi Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Image name prefix
        required: false
        default: nodespark-wisp

jobs:
  build:
    name: Build NodeSpark Wisp Raspberry Pi OS image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils git quilt parted qemu-user-static rsync xz-utils zip

      - name: Build image with pi-gen
        env:
          WISP_IMAGE_NAME: ${{ inputs.image_name }}
          WISP_IMAGE_USE_DOCKER: "1"
        run: bash scripts/build_pi_image.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image_name }}-raspberry-pi-os
          path: ~/.cache/nodespark-wisp/pi-gen/deploy/${{ inputs.image_name }}*.img.xz
          if-no-files-found: error
